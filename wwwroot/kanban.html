<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カンバンボード - チケット管理システム</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
</head>
<body>
    <!-- ログイン画面 -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>カンバンボード</h2>
            <p class="login-subtitle">ログインしてください</p>
            <form id="loginForm">
                <div class="login-field">
                    <label for="loginUsername">ユーザ名</label>
                    <input type="text" id="loginUsername" placeholder="ユーザ名" autocomplete="username" required>
                </div>
                <div class="login-field">
                    <label for="loginPassword">パスワード</label>
                    <input type="password" id="loginPassword" placeholder="パスワード" autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">ログイン</button>
                <div class="login-error hidden" id="loginError"></div>
            </form>
        </div>
    </div>

    <!-- アプリケーションコンテンツ（ログイン成功后に表示） -->
    <div id="appContent" class="hidden">
    <!-- 画面左上のフィルターエリア -->
    <div class="filter-area hidden" id="filterArea">
        <!-- 閉じるボタン -->
        <button class="filter-close-btn" id="filterCloseBtn" title="閉じる">×</button>
        <!-- チケット検索ボックス -->
        <div class="search-box" id="searchBox">
            <span class="filter-icon">🔍</span>
            <input type="text" id="titleSearchInput" placeholder="チケットで検索...">
        </div>
        <!-- 担当者フィルター -->
        <div class="assignee-filter" id="assigneeFilter">
            <span class="filter-icon">👤</span>
            <select id="assigneeFilterSelect">
                <option value="">すべて</option>
            </select>
        </div>
        <!-- メイン担当限定チェックボックス -->
        <div class="main-assignee-filter" id="mainAssigneeFilter">
            <label>
                <input type="checkbox" id="mainAssigneeOnlyCheckbox">
                <span>メイン担当限定</span>
            </label>
        </div>
        <!-- ラベルフィルター -->
        <div class="label-filter" id="labelFilter">
            <span class="filter-icon">🏷️</span>
            <select id="labelFilterSelect">
                <option value="">すべて</option>
            </select>
        </div>
    </div>

    <!-- メインコンテナ（左右分割用） -->
    <div class="main-container" id="mainContainer">
        <div class="kanban-main" id="kanbanMain">
            <div class="kanban-board">
        <!-- 担当者用メモカラム -->
        <div class="column column-memo hidden" data-column="memo" id="memoColumn">
            <div class="column-header">
                <div class="column-title" id="memoColumnTitle">
                    Memo
                    <button class="column-close-btn" id="memoCloseBtn" title="閉じる">×</button>
                </div>
            </div>
            <div class="memo-area">
                <textarea id="assigneeMemoText" placeholder="メモを記述..."></textarea>
            </div>
            <div class="assignee-chart-area">
                <div class="chart-title">予実グラフ（累積工数）</div>
                <div class="assignee-chart" id="assigneeChart"></div>
                <div class="chart-legend">
                    <span class="legend-item"><span class="legend-line planned"></span>予定</span>
                    <span class="legend-item"><span class="legend-line actual"></span>実績</span>
                </div>
            </div>
        </div>

        <div class="column" data-column="todo">
            <div class="column-header">
                <div class="column-title">To Do<button class="column-add-btn" data-column="todo" title="新規チケットを追加">+</button></div>
            </div>
            <div class="ticket-list"></div>
        </div>

        <div class="column" data-column="doing">
            <div class="column-header">
                <div class="column-title">Doing<button class="column-add-btn" data-column="doing" title="新規チケットを追加">+</button></div>
            </div>
            <div class="ticket-list"></div>
        </div>

        <div class="column" data-column="done">
            <div class="column-header">
                <div class="column-title">Done<button class="column-add-btn" data-column="done" title="新規チケットを追加">+</button></div>
            </div>
            <div class="ticket-list"></div>
        </div>

        <!-- アーカイブ（初期非表示） -->
        <div class="column hidden" data-column="archive" id="archiveColumn">
            <div class="column-header">
                <div class="column-title">Archive<button class="column-close-btn" id="archiveCloseBtn" title="アーカイブを非表示">×</button></div>
            </div>
            <div class="ticket-list"></div>
        </div>
    </div><!-- /kanban-board -->
        </div><!-- /kanban-main -->

    </div><!-- /main-container -->

    <!-- 設定モーダル -->
    <div class="modal-overlay" id="settingsModal" role="dialog" aria-modal="true">
        <div class="modal settings-modal">
            <div class="modal-header">
                <div class="modal-title">⚙️ 設定</div>
            </div>
            <div class="settings-body">
                <!-- 担当者管理 -->
                <section class="settings-section">
                    <h3>担当者管理</h3>
                    <p class="settings-hint">担当者のマスターデータ。削除しても既存チケットの割り当てには影響しません。</p>
                    <div class="settings-list" id="usersList"></div>
                    <div class="settings-add-row">
                        <input type="text" id="newUserInput" placeholder="担当者名を入力" autocomplete="off"/>
                        <button class="settings-add-btn" id="addUserBtn">追加</button>
                    </div>
                </section>

                <!-- ラベル管理 -->
                <section class="settings-section">
                    <h3>ラベル管理</h3>
                    <p class="settings-hint">ラベルと色を設定。削除しても既存チケットのラベルには影響しません。</p>
                    <div class="settings-list" id="labelsList"></div>
                    <div class="settings-add-row">
                        <input type="text" id="newLabelNameInput" placeholder="ラベル名" autocomplete="off"/>
                        <input type="color" id="newLabelColorInput" value="#808080" title="ラベル色"/>
                        <button class="settings-add-btn" id="addLabelBtn">追加</button>
                    </div>
                </section>

                <!-- 休日管理 -->
                <section class="settings-section">
                    <h3>休日管理</h3>
                    <p class="settings-hint">土曜日・日曜日以外の祝日・休日を入力（8桁: yyyyMMdd、1行に1つ）。</p>
                    <textarea id="holidaysTextarea" class="holidays-textarea" placeholder="20260530&#10;20260601"></textarea>
                </section>

                <!-- DBエクスポート/インポート -->
                <section class="settings-section">
                    <h3>データベース</h3>
                    <div class="db-actions">
                        <button class="settings-db-btn" id="exportDbBtn">📤 エクスポート</button>
                        <button class="settings-db-btn" id="importDbBtn">📥 インポート</button>
                        <button class="settings-db-btn" id="importCsvBtn">📄 CSVインポート</button>
                        <input type="file" id="importFileInput" accept=".json" class="hidden"/>
                        <input type="file" id="importCsvFileInput" accept=".csv" class="hidden"/>
                    </div>
                </section>
            </div>
        </div>
    </div><!-- /settingsModal -->

    <!-- 画面左下のボタン（検索 + グラフ + 設定 + Archive + ログ + ログアウト） -->
    <div class="bottom-left-buttons">
        <button class="floating-icon-btn filter-toggle-btn" id="filterToggleBtn" title="検索ウィンドウを表示/非表示">🔍</button>
        <button class="floating-icon-btn graph-toggle-btn" id="graphToggleBtn" title="グラフを表示/非表示">📊</button>
        <button class="floating-icon-btn settings-btn" id="settingsBtn" title="設定">⚙️</button>
        <button class="floating-icon-btn archive-toggle-bottom-btn" id="archiveToggleBtn" title="アーカイブを表示/非表示">📦</button>
        <button class="floating-icon-btn memo-toggle-bottom-btn hidden" id="memoToggleBtn" title="メモを表示/非表示">📝</button>
        <button class="floating-icon-btn logs-btn" id="logsBtn" title="ログ">📋</button>
        <button class="floating-icon-btn actual-input-btn" id="actualInputBtn" title="実績入力">⏱</button>
        <button class="floating-icon-btn logout-btn hidden" id="logoutBtn" title="ログアウト">🚪</button>
    </div>

    <!-- グラフパネル（初期非表示） -->
    <div class="graph-panel" id="graphPanel">
        <div class="graph-panel-resize-handle" id="graphPanelResizeHandle"></div>
        <div class="graph-panel-body hidden" id="graphPanelBody">
            <div class="graph-panel-controls">
                <label for="graphViewSelect">表示:</label>
                <select id="graphViewSelect">
                    <option value="timeline">タイムライン</option>
                    <option value="matrix">進捗表</option>
                    <option value="ticketProgress">チケットプログレス</option>
                </select>
                <label for="graphAssigneeToggleBtn">担当者:</label>
                <div class="custom-dropdown" id="graphAssigneeDropdown">
                    <button type="button" class="dropdown-toggle-btn" id="graphAssigneeToggleBtn">担当者を選択 ▼</button>
                    <div class="dropdown-list" id="graphAssigneeList"></div>
                </div>
                <label for="graphLabelFilter">ラベル選択:</label>
                <select id="graphLabelFilter">
                    <option value="">ラベルを選択してください</option>
                </select>
                <label for="graphExcludeToggleBtn">除外チケット:</label>
                <div class="custom-dropdown" id="excludeTicketsDropdown">
                    <button type="button" class="dropdown-toggle-btn" id="graphExcludeToggleBtn">除外チケットを選択 ▼</button>
                    <div class="dropdown-list" id="excludeTicketsList"></div>
                </div>
            </div>
            <div class="graph-panel-content">
                <div class="matrix-table-container" id="matrixTableContainer"></div>
            </div>
        </div>
    </div><!-- /graph-panel -->

    <!-- ログパネル（初期非表示） -->
    <div class="side-panel logs-panel" id="logsPanel">
        <div class="side-panel-header logs-header">
            <div class="side-panel-title logs-title">📋 ログ</div>
            <button class="side-panel-close-btn logs-close-btn" id="logsCloseBtn" title="閉じる">✕</button>
        </div>
        <div class="logs-toolbar">
            <button class="logs-toolbar-btn" id="logsCopyBtn" title="クリップボードにコピー">📋 コピー</button>
            <button class="logs-toolbar-btn" id="logsExportBtn" title="テキストとしてエクスポート">💾 エクスポート</button>
            <select id="logsLevelFilter" class="logs-level-filter">
                <option value="DEBUG">すべて</option>
                <option value="INFO">INFO以上</option>
                <option value="WARN">WARN以上</option>
                <option value="ERROR">ERRORのみ</option>
            </select>
            <input type="text" id="logsSearchInput" class="logs-search-input" placeholder="検索...">
        </div>
        <div class="logs-body">
            <div class="logs-list" id="logsList"></div>
        </div>
        <div class="logs-footer">
            <button class="logs-footer-btn" id="logsFetchServerBtn" title="サーバーログを取得">🖥 サーバーログを取得</button>
            <span class="logs-count" id="logsCount">0 件</span>
        </div>
    </div><!-- /logs-panel -->

    <!-- モーダルダイアログ -->
    <div class="modal-overlay" id="ticketModal" role="dialog" aria-modal="true">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">新しいチケット</div>
                <div class="modal-header-buttons">
                    <button type="button" class="modal-hamburger-btn" id="modalHamburgerBtn" title="メニュー">☰</button>
                    <div class="modal-hamburger-menu" id="modalHamburgerMenu"></div>
                </div>
            </div>
            
            <div class="modal-body-two-column">
                <div class="modal-left-column">
                    <div class="form-group">
                        <label for="ticketTitle">タイトル</label>
                        <input type="text" id="ticketTitle" placeholder="タスクのタイトルを入力">
                        <div class="category-display" id="ticketCategoryDisplay"></div>
                    </div>

                    <div class="form-row three-fields">
                        <div class="form-group">
                            <label for="startDate">開始日</label>
                            <input type="date" id="startDate">
                        </div>
                        <div class="form-group">
                            <label for="endDate">終了日</label>
                            <input type="date" id="endDate">
                        </div>
                        <div class="form-group">
                            <label for="effort">予定工数（時間）</label>
                            <input type="number" id="effort" placeholder="例: 8" min="0">
                        </div>
                    </div>

                    <div class="form-row two-fields">
                        <div class="form-group">
                            <label id="assigneeLabel">担当者</label>
                            <div class="selection-tags" id="assigneeTags" aria-labelledby="assigneeLabel"></div>
                            <div class="custom-dropdown" id="assigneeDropdown">
                                <button type="button" class="dropdown-toggle-btn" id="assigneeToggleBtn">担当者を選択 ▼</button>
                                <div class="dropdown-list" id="assigneeList"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label id="labelLabel">ラベル</label>
                            <div class="selection-tags" id="labelTags" aria-labelledby="labelLabel"></div>
                            <div class="custom-dropdown" id="labelDropdown">
                                <button type="button" class="dropdown-toggle-btn" id="labelToggleBtn">ラベルを選択 ▼</button>
                                <div class="dropdown-list" id="labelList"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label id="childTasksLabel">子タスク</label>
                        <div class="child-tasks" id="childTasks" aria-labelledby="childTasksLabel"></div>
                        <button class="add-child-task-btn" id="addChildTaskBtn">＋ 子タスクを追加</button>
                    </div>
                </div>
                
                <div class="modal-right-column">
                    <div class="form-group memo-ticket">
                        <label for="memo">チケットメモ</label>
                        <textarea id="memo" placeholder="詳細な説明やメモ..."></textarea>
                    </div>
                    <div id="childTaskMemoGroup" class="form-group memo-child-task" style="display:none;">
                        <label for="childTaskMemo">子タスクメモ <span id="childTaskMemoName"></span></label>
                        <textarea id="childTaskMemo" placeholder="メモを入力..."></textarea>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="modal-btn cancel" id="cancelBtn">キャンセル</button>
                <button class="modal-btn save" id="saveBtn">保存</button>
            </div>
        </div>
    </div>


    <!-- 実績入力ウィンドウ（初期非表示） -->
    <div class="modal-overlay" id="actualModalOverlay">
        <div class="modal actual-table-modal">
            <div class="modal-header">
                <div class="modal-title">⏱ 実績入力</div>
            </div>
            <div class="actual-panel-controls">
                <div class="actual-control-group">
                    <label for="actualTableMonthInput">対象月:</label>
                    <input type="month" id="actualTableMonthInput">
                </div>
                <div class="actual-control-group">
                    <label>対象:</label>
                    <div class="custom-dropdown" id="actualColumnDropdown">
                        <button type="button" class="dropdown-toggle-btn" id="actualColumnToggleBtn">対象を選択 ▼</button>
                        <div class="dropdown-list" id="actualColumnList"></div>
                    </div>
                </div>
                <div class="actual-control-group">
                    <label for="actualTableAssigneeSelect">担当者:</label>
                    <select id="actualTableAssigneeSelect">
                        <option value="">すべて</option>
                    </select>
                </div>
            </div>
            <div class="actual-table-container" id="actualTableContainer">
                <div class="actual-table-wrapper">
                    <div class="actual-table-loading" id="actualTableLoading">
                        <div class="spinner"></div>
                        <span>読み込み中...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
